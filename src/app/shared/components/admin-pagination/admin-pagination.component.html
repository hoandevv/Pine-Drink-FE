<nav class="admin-pagination" aria-label="Phân trang quản trị">
  <div class="admin-pagination__status" aria-live="polite">
    <span class="desktop-status">{{ statusText }}</span>
    <span class="mobile-status">
      <strong>{{ mobilePageText }}</strong>
      <small *ngIf="mobileCountText">{{ mobileCountText }}</small>
    </span>
  </div>

  <label class="admin-pagination__size" *ngIf="showPageSize">
    <span>Hiển thị</span>
    <select aria-label="Số dòng mỗi trang" [ngModel]="pageSize" (ngModelChange)="changePageSize($event)"
      [disabled]="disabled">
      <option *ngFor="let size of pageSizeOptions" [ngValue]="size">{{ size }}</option>
    </select>
    <span>/ trang</span>
  </label>

  <div class="admin-pagination__actions">
    <button type="button" aria-label="Trang đầu" title="Về đầu" (click)="first()" [disabled]="previousDisabled">
      <span class="material-symbols-outlined" aria-hidden="true">first_page</span>
    </button>

    <button type="button" aria-label="Trang trước" (click)="previous()" [disabled]="previousDisabled">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_left</span>
    </button>

    <button
      *ngFor="let pageItem of visiblePages"
      type="button"
      class="admin-pagination__page"
      [class.is-active]="pageItem === page"
      [attr.aria-label]="'Chuyển tới trang ' + (pageItem + 1)"
      [attr.aria-current]="pageItem === page ? 'page' : null"
      (click)="goToPage(pageItem)"
      [disabled]="disabled || pageItem === page">
      {{ pageItem + 1 }}
    </button>

    <button type="button" aria-label="Trang sau" (click)="next()" [disabled]="nextDisabled">
      <span class="material-symbols-outlined" aria-hidden="true">chevron_right</span>
    </button>

    <button type="button" aria-label="Trang cuối" title="Về cuối" (click)="last()" [disabled]="nextDisabled">
      <span class="material-symbols-outlined" aria-hidden="true">last_page</span>
    </button>
  </div>
</nav>
